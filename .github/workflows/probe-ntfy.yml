name: probe-ntfy
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test ntfy JSON publish with Korean title/body
        run: |
          node -e '
            (async () => {
              const res = await fetch("https://ntfy.sh/", {
                method: "POST",
                headers: { "Content-Type": "application/json; charset=utf-8" },
                body: JSON.stringify({
                  topic: "krating-gxsignal-7k2m4x",
                  title: "[테스트] K-Rating 모의투자 알림 연동 확인",
                  message: "이 메시지가 보이면 돌파 합의 알파 매수/매도 알림이 정상 작동합니다. (실제 거래 아님, 자동 검증용)",
                  click: "https://kospi-k-rating.web.app/#/paper/alpha_breakout_consensus",
                  tags: ["test_tube"],
                }),
              });
              console.log("status:", res.status);
              console.log(await res.text());
              if (res.status !== 200) process.exit(1);
            })();
          '
