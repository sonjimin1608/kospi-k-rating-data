name: hourly-build
# 2026-07-08: 7/7 GitHub Actions 장애 중 등록된 스케줄이 발화하지 않아 재등록용 커밋 (공식 처방: 기본 브랜치 커밋 → 스케줄 재동기화)

on:
  schedule:
    # 평일 09:00~17:00 KST, 10분 간격 (UTC = KST-9). GitHub cron은 혼잡 시 지연·탈락될 수 있음.
    - cron: '*/10 0-7 * * 1-5'  # 00:00~07:50 UTC = 09:00~16:50 KST (10분마다)
    - cron: '0 8 * * 1-5'       # 08:00 UTC = 17:00 KST (마지막 갱신)
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # build-data.js는 <root>/public/data 에 쓰고, alerts 30일 이력 병합을 위해
      # 기존 alerts.json이 그 위치에 있어야 한다 → 직전 커밋의 data/를 시딩
      - name: Seed previous data
        run: |
          mkdir -p public/data
          cp -r data/. public/data/

      - name: Build (KOSPI200 재수집·재스코어링)
        run: node scripts/build-data.js

      # 장 휴장 등으로 시세·점수가 전혀 안 변했으면(updatedAt 제외 비교) 커밋 스킵
      - name: Detect changes
        id: diff
        run: |
          node -e '
            const fs = require("fs");
            const norm = (p, drop) => { try { const j = JSON.parse(fs.readFileSync(p, "utf8")); (drop || []).forEach((k) => delete j[k]); return JSON.stringify(j); } catch { return "MISSING:" + p; } };
            const sumSame = norm("data/summary.json", ["updatedAt"]) === norm("public/data/summary.json", ["updatedAt"]);
            const btSame = norm("data/sim/backtest.json", ["generatedAt"]) === norm("public/data/sim/backtest.json", ["generatedAt"]);
            const changed = !sumSame || !btSame;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "changed=" + (changed ? "yes" : "no") + "\n");
            console.log(changed ? ("데이터 변경 감지 (summary=" + (!sumSame) + ", backtest=" + (!btSame) + ")") : "무변경 — 커밋 스킵");
          '

      - name: Push new-signal notifications (ntfy)
        if: steps.diff.outputs.changed == 'yes'
        run: |
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("public/data/alerts.json", "utf8"));
            const fresh = (j.signals || []).filter((s) => s.isNew);
            console.log("신규 신호:", fresh.length);
            (async () => {
              for (const s of fresh) {
                const res = await fetch("https://ntfy.sh/krating-gxsignal-7k2m4x", {
                  method: "POST",
                  headers: {
                    "Title": "K-Rating golden cross",
                    "Click": "https://kospi-k-rating.web.app/#/stock/" + encodeURIComponent(s.code),
                    "Tags": "chart_with_upwards_trend",
                  },
                  body: `${s.name} ${Number(s.price).toLocaleString("ko-KR")}원 — ${s.desc}`,
                });
                console.log(s.code, s.name, res.status);
              }
            })().catch((e) => { console.error("ntfy 발송 실패(빌드는 계속):", e.message); });
          '

      - name: Push paper-trade notifications (ntfy)
        # notifyTrades 전략의 신규 매수/매도 체결. 시세 diff와 무관하게 항상 확인(누락 방지).
        run: |
          node -e '
            const fs = require("fs");
            let j = { notifications: [] };
            try { j = JSON.parse(fs.readFileSync("public/data/sim/paper_notify.json", "utf8")); } catch {}
            const trades = j.notifications || [];
            console.log("모의투자 신규 체결:", trades.length);
            (async () => {
              for (const t of trades) {
                const isBuy = t.type === "buy";
                const title = `K-Rating 모의투자 · ${t.strategyName} · ${isBuy ? "매수" : "매도"}`;
                const amount = Number(t.price) * Number(t.shares);
                const body = isBuy
                  ? `${t.name}(${t.code}) ${t.shares}주 @ ${Number(t.price).toLocaleString("ko-KR")}원 (${amount.toLocaleString("ko-KR")}원) · 목표 ${Number(t.targetPrice).toLocaleString("ko-KR")}원`
                  : `${t.name}(${t.code}) ${t.shares}주 @ ${Number(t.price).toLocaleString("ko-KR")}원 · ${t.reason} · 수익률 ${t.returnPct}% (${Number(t.pnl).toLocaleString("ko-KR")}원)`;
                // 제목에 한글(비-ASCII)이 들어가므로 HTTP 헤더 대신 ntfy JSON 발행 API 사용
                // (헤더에 UTF-8 문자를 직접 넣으면 fetch가 "Invalid character in header content"로 실패한다)
                const res = await fetch("https://ntfy.sh/", {
                  method: "POST",
                  headers: { "Content-Type": "application/json; charset=utf-8" },
                  body: JSON.stringify({
                    topic: "krating-gxsignal-7k2m4x",
                    title,
                    message: body,
                    click: "https://kospi-k-rating.web.app/#/paper/" + encodeURIComponent(t.strategyId),
                    tags: [isBuy ? "moneybag" : (Number(t.returnPct) >= 0 ? "chart_with_upwards_trend" : "chart_with_downwards_trend")],
                  }),
                });
                console.log(t.strategyId, t.type, t.code, t.name, res.status);
              }
            })().catch((e) => { console.error("ntfy 발송 실패(빌드는 계속):", e.message); });
          '

      - name: Commit & push
        if: steps.diff.outputs.changed == 'yes'
        run: |
          cp -r public/data/. data/
          rm -rf data/sim && cp -r public/data/sim data/sim
          git add data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: rebuild $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
          git push
